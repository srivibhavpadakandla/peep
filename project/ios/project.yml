name: PeepApp
options:
  bundleIdPrefix: app.peep
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PeepApp:
    type: application
    platform: iOS
    sources:
      - path: PeepApp
        excludes:
          - "Web/**"
      - path: PeepApp/Web
        type: folder        # bundle as a folder reference so paths stay intact
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.peep.PeepApp
        PRODUCT_NAME: PeepApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PeepApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: "\"PeepApp/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
