<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peep — interactive prototype</title>
  <style>
    html, body, #root { margin: 0; height: 100%; background: #0d0d11; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

    /* Atom animations */
    @keyframes peepPulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes peepFlash  { from { opacity: 0.8; } to { opacity: 0; } }
    @keyframes peepFade   { from { opacity: 0; }   to { opacity: 1; } }
    @keyframes peepCaret  { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    /* Push/pop screen transitions */
    @keyframes peepPushIn {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }

    /* Sheet slide-up */
    @keyframes peepSheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* Toast slide + fade in */
    @keyframes peepToastIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* Porch scene */
    @keyframes peepTwinkle {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1;   }
    }
    @keyframes peepMoth {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-18px, 22px); }
      50%  { transform: translate(8px, 36px); }
      75%  { transform: translate(-26px, 14px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes peepRain {
      0%   { transform: translateY(0);     opacity: 0;   }
      10%  { opacity: 0.6; }
      100% { transform: translateY(600px); opacity: 0;   }
    }
    @keyframes peepShake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-2px); }
      75%      { transform: translateX(2px); }
    }

    /* Event-arrival on Live's Active Card */
    @keyframes peepEventArrive {
      0%   { transform: translateY(20px) scale(0.96); opacity: 0; }
      60%  { transform: translateY(-2px) scale(1.01); opacity: 1; }
      100% { transform: translateY(0)     scale(1);    opacity: 1; }
    }

    /* Cross-screen row highlight */
    @keyframes peepHighlight {
      0%   { box-shadow: 0 0 0 0   rgba(15,184,130,0); background: #1C1C1E; }
      30%  { box-shadow: 0 0 0 3px rgba(15,184,130,0.5); background: rgba(15,184,130,0.18); }
      100% { box-shadow: 0 0 0 0   rgba(15,184,130,0); background: #1C1C1E; }
    }

    /* Onboarding pairing ring */
    @keyframes peepRing {
      from { transform: scale(1);   opacity: 0.6; }
      to   { transform: scale(1.6); opacity: 0;   }
    }

    /* Push notification banner */
    @keyframes peepBannerDrop {
      from { transform: translateY(-120%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    /* Pull-to-refresh spinner */
    @keyframes peepSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Hero camera agent satellites */
    @keyframes peepFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* Hide scrollbars on iOS-feel scroll areas */
    *::-webkit-scrollbar { display: none; }
    input { -webkit-appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="interactive-data.jsx"></script>
  <script type="text/babel" src="interactive-core.jsx"></script>
  <script type="text/babel" src="interactive-onboarding.jsx"></script>
  <script type="text/babel" src="interactive-live.jsx"></script>
  <script type="text/babel" src="interactive-activity.jsx"></script>
  <script type="text/babel" src="interactive-detail.jsx"></script>
  <script type="text/babel" src="interactive-inbox.jsx"></script>
  <script type="text/babel" src="interactive-settings.jsx"></script>
  <script type="text/babel" src="interactive-community.jsx"></script>
  <script type="text/babel" src="interactive-app.jsx"></script>
</body>
</html>
